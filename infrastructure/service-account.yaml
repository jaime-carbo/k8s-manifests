apiVersion: v1
kind: ServiceAccount
metadata:
  name: olas-reader
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: olas-cluster-reader
rules:
- apiGroups: [""]
  resources: ["nodes", "pods", "namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes", "pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: olas-cluster-reader-binding
subjects:
- kind: ServiceAccount
  name: olas-reader
  namespace: default
roleRef:
  kind: ClusterRole
  name: olas-cluster-reader
  apiGroup: rbac.authorization.k8s.io